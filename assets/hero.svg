<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600">
  <!-- GRID PROTOCOL MANIFEST
       canvas: 1200x600 (marketing)
       palette: complexity-curves (background #0d1117, accents red/amber/blue/green/purple)
       text_elements: 0
       stroke_width_min: 3.5
       fill_opacity_min: 0.25
       role: img
  -->
  <!--
    big-o-python-to-rust — Marketing
    3-section flow: Python snake (LEFT) emitting O(n^2) curve → complexity curves graph (MIDDLE)
    → Rust gear + stopwatch + criterion benchmark bars (RIGHT)
  -->
  <defs>
    <linearGradient id="topAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff9d1a" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#9f8fef" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#4a9eff" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="bottomAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4a9eff" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#36b37e" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ff9d1a" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="leftAura" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#ff9d1a" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="midAura" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#9f8fef" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rightAura" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#4a9eff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="snakeFill" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#ff9d1a" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#1a1d23" stop-opacity="0.95"/>
    </radialGradient>
    <radialGradient id="gearFill" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#4a9eff" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#1a1d23" stop-opacity="0.95"/>
    </radialGradient>
    <linearGradient id="redCurve" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff5630" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ff8a4c" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="amberCurve" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff9d1a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffb380" stop-opacity="0.95"/>
    </linearGradient>
    <marker id="arrowAccent" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#9f8fef" fill-opacity="0.95"/>
    </marker>
  </defs>

  <!-- background -->
  <rect width="1200" height="600" fill="#0d1117"/>
  <circle cx="200" cy="300" r="240" fill="url(#leftAura)"/>
  <circle cx="600" cy="300" r="260" fill="url(#midAura)"/>
  <circle cx="1000" cy="300" r="240" fill="url(#rightAura)"/>

  <!-- top + bottom accent strips -->
  <rect x="0" y="0" width="1200" height="10" fill="url(#topAccent)"/>
  <rect x="0" y="590" width="1200" height="10" fill="url(#bottomAccent)"/>

  <!-- corner accent dots -->
  <circle cx="40" cy="40" r="11" fill="#ff9d1a" fill-opacity="0.55"/>
  <circle cx="1160" cy="40" r="11" fill="#4a9eff" fill-opacity="0.55"/>
  <circle cx="40" cy="560" r="11" fill="#36b37e" fill-opacity="0.55"/>
  <circle cx="1160" cy="560" r="11" fill="#ff5630" fill-opacity="0.55"/>

  <!-- ============================================================ -->
  <!-- LEFT SECTION: Python snake (S-shape stacked ellipses)         -->
  <!-- ============================================================ -->
  <g>
    <!-- panel frame -->
    <rect x="50" y="80" width="320" height="450" rx="16" fill="#161b22" fill-opacity="0.85" stroke="#ff9d1a" stroke-width="4.5" stroke-opacity="0.65"/>
    <rect x="50" y="80" width="320" height="36" rx="16" fill="#1a1d23"/>
    <rect x="50" y="112" width="320" height="4" fill="#ff9d1a" fill-opacity="0.65"/>
    <!-- mac-style file dots -->
    <circle cx="78" cy="98" r="7" fill="#ff5630" fill-opacity="0.85"/>
    <circle cx="100" cy="98" r="7" fill="#ffb380" fill-opacity="0.85"/>
    <circle cx="122" cy="98" r="7" fill="#36b37e" fill-opacity="0.85"/>

    <!-- snake body — S curve from upper-right of panel down to lower-left -->
    <ellipse cx="280" cy="160" rx="36" ry="28" fill="url(#snakeFill)" stroke="#ff9d1a" stroke-width="5" stroke-opacity="0.95"/>
    <ellipse cx="240" cy="200" rx="34" ry="27" fill="url(#snakeFill)" stroke="#ff9d1a" stroke-width="5" stroke-opacity="0.95"/>
    <ellipse cx="200" cy="240" rx="32" ry="26" fill="url(#snakeFill)" stroke="#ff9d1a" stroke-width="5" stroke-opacity="0.95"/>
    <ellipse cx="160" cy="285" rx="30" ry="25" fill="url(#snakeFill)" stroke="#ff9d1a" stroke-width="5" stroke-opacity="0.95"/>
    <ellipse cx="140" cy="335" rx="29" ry="24" fill="url(#snakeFill)" stroke="#ff9d1a" stroke-width="5" stroke-opacity="0.95"/>
    <ellipse cx="160" cy="385" rx="29" ry="24" fill="url(#snakeFill)" stroke="#ff9d1a" stroke-width="5" stroke-opacity="0.95"/>
    <ellipse cx="200" cy="425" rx="30" ry="24" fill="url(#snakeFill)" stroke="#ff9d1a" stroke-width="5" stroke-opacity="0.95"/>
    <ellipse cx="250" cy="455" rx="32" ry="25" fill="url(#snakeFill)" stroke="#ff9d1a" stroke-width="5" stroke-opacity="0.95"/>

    <!-- snake head (upper-right) -->
    <ellipse cx="300" cy="130" rx="40" ry="34" fill="#ff9d1a" fill-opacity="0.85" stroke="#ffb380" stroke-width="5" stroke-opacity="0.95"/>
    <!-- eye -->
    <circle cx="316" cy="120" r="7" fill="#0d1117"/>
    <circle cx="318" cy="118" r="2.5" fill="#ffffff" fill-opacity="0.85"/>
    <!-- forked tongue -->
    <path d="M 340 135 Q 360 135 372 128 M 340 140 Q 360 140 372 147" stroke="#ff5630" stroke-width="4" fill="none" stroke-opacity="0.95"/>
    <!-- yellow accent stripe on head -->
    <path d="M 268 122 Q 295 110 322 110" stroke="#ffeb3b" stroke-width="4" fill="none" stroke-opacity="0.85"/>

    <!-- scale dots on body -->
    <g fill="#ffffff" fill-opacity="0.30">
      <circle cx="280" cy="160" r="4"/>
      <circle cx="240" cy="200" r="4"/>
      <circle cx="200" cy="240" r="4"/>
      <circle cx="160" cy="285" r="4"/>
      <circle cx="140" cy="335" r="4"/>
      <circle cx="160" cy="385" r="4"/>
      <circle cx="200" cy="425" r="4"/>
      <circle cx="250" cy="455" r="4"/>
    </g>

    <!-- tail at bottom -->
    <polygon points="290,475 320,495 305,460" fill="#ff9d1a" fill-opacity="0.85" stroke="#ffb380" stroke-width="4" stroke-opacity="0.95"/>

    <!-- O(n^2) curve emerging from snake's mouth -->
    <path d="M 365 138 Q 400 130 415 110" stroke="url(#redCurve)" stroke-width="7" fill="none" stroke-opacity="0.95"/>
  </g>

  <!-- ARROW left → middle -->
  <line x1="378" y1="300" x2="438" y2="300" stroke="#9f8fef" stroke-width="6" stroke-opacity="0.85" marker-end="url(#arrowAccent)"/>
  <circle cx="383" cy="300" r="6" fill="#9f8fef" fill-opacity="0.85"/>

  <!-- ============================================================ -->
  <!-- MIDDLE SECTION: complexity curves graph                       -->
  <!-- ============================================================ -->
  <g>
    <!-- panel frame -->
    <rect x="448" y="80" width="304" height="450" rx="16" fill="#161b22" fill-opacity="0.95" stroke="#9f8fef" stroke-width="4.5" stroke-opacity="0.70"/>
    <rect x="448" y="80" width="304" height="36" rx="16" fill="#1a1d23"/>
    <rect x="448" y="112" width="304" height="4" fill="#9f8fef" fill-opacity="0.65"/>

    <!-- horizontal gridlines -->
    <g stroke="#9f8fef" stroke-width="3.5" stroke-opacity="0.15">
      <line x1="480" y1="150" x2="730" y2="150"/>
      <line x1="480" y1="190" x2="730" y2="190"/>
      <line x1="480" y1="230" x2="730" y2="230"/>
      <line x1="480" y1="270" x2="730" y2="270"/>
      <line x1="480" y1="310" x2="730" y2="310"/>
      <line x1="480" y1="350" x2="730" y2="350"/>
      <line x1="480" y1="390" x2="730" y2="390"/>
      <line x1="480" y1="430" x2="730" y2="430"/>
      <line x1="480" y1="470" x2="730" y2="470"/>
    </g>
    <!-- vertical gridlines -->
    <g stroke="#9f8fef" stroke-width="3.5" stroke-opacity="0.12">
      <line x1="520" y1="130" x2="520" y2="490"/>
      <line x1="560" y1="130" x2="560" y2="490"/>
      <line x1="600" y1="130" x2="600" y2="490"/>
      <line x1="640" y1="130" x2="640" y2="490"/>
      <line x1="680" y1="130" x2="680" y2="490"/>
      <line x1="720" y1="130" x2="720" y2="490"/>
    </g>

    <!-- Y axis -->
    <line x1="480" y1="130" x2="480" y2="490" stroke="#a5d6ff" stroke-width="6" stroke-opacity="0.95"/>
    <!-- X axis -->
    <line x1="480" y1="490" x2="740" y2="490" stroke="#a5d6ff" stroke-width="6" stroke-opacity="0.95"/>
    <!-- arrowheads -->
    <polygon points="480,122 472,140 488,140" fill="#a5d6ff" fill-opacity="0.95"/>
    <polygon points="748,490 730,482 730,498" fill="#a5d6ff" fill-opacity="0.95"/>
    <!-- axis tick marks -->
    <g stroke="#a5d6ff" stroke-width="3.5" stroke-opacity="0.85">
      <line x1="468" y1="150" x2="480" y2="150"/>
      <line x1="468" y1="190" x2="480" y2="190"/>
      <line x1="468" y1="230" x2="480" y2="230"/>
      <line x1="468" y1="270" x2="480" y2="270"/>
      <line x1="468" y1="310" x2="480" y2="310"/>
      <line x1="468" y1="350" x2="480" y2="350"/>
      <line x1="468" y1="390" x2="480" y2="390"/>
      <line x1="468" y1="430" x2="480" y2="430"/>
      <line x1="468" y1="470" x2="480" y2="470"/>
      <line x1="520" y1="490" x2="520" y2="502"/>
      <line x1="560" y1="490" x2="560" y2="502"/>
      <line x1="600" y1="490" x2="600" y2="502"/>
      <line x1="640" y1="490" x2="640" y2="502"/>
      <line x1="680" y1="490" x2="680" y2="502"/>
      <line x1="720" y1="490" x2="720" y2="502"/>
    </g>

    <!-- CURVES -->
    <!-- O(1) flat at bottom -->
    <path d="M 490 478 Q 600 478 730 478" stroke="#36b37e" stroke-width="6" fill="none" stroke-opacity="0.95"/>
    <!-- O(log n) -->
    <path d="M 490 465 Q 580 450 660 442 Q 700 438 730 436" stroke="#00875a" stroke-width="6" fill="none" stroke-opacity="0.95"/>
    <!-- O(n) linear diagonal -->
    <path d="M 490 478 L 730 270" stroke="#4a9eff" stroke-width="7" fill="none" stroke-opacity="0.95"/>
    <!-- O(n log n) gently curving -->
    <path d="M 490 478 Q 580 430 650 360 Q 700 290 730 210" stroke="url(#amberCurve)" stroke-width="7" fill="none" stroke-opacity="0.95"/>
    <!-- O(n^2) steep -->
    <path d="M 490 478 Q 580 460 630 370 Q 680 260 715 160" stroke="url(#redCurve)" stroke-width="8" fill="none" stroke-opacity="0.95"/>
    <!-- O(2^n) almost vertical, dashed -->
    <path d="M 490 478 Q 600 478 660 400 Q 695 320 705 160" stroke="#ff8a4c" stroke-width="6" fill="none" stroke-opacity="0.85" stroke-dasharray="10,6"/>

    <!-- curve endpoint dots -->
    <circle cx="730" cy="478" r="8" fill="#36b37e" fill-opacity="0.95" stroke="#7ee787" stroke-width="3.5"/>
    <circle cx="730" cy="436" r="8" fill="#00875a" fill-opacity="0.95" stroke="#7ee787" stroke-width="3.5"/>
    <circle cx="730" cy="270" r="8" fill="#4a9eff" fill-opacity="0.95" stroke="#a5d6ff" stroke-width="3.5"/>
    <circle cx="730" cy="210" r="8" fill="#ff9d1a" fill-opacity="0.95" stroke="#ffb380" stroke-width="3.5"/>
    <circle cx="715" cy="160" r="9" fill="#ff5630" fill-opacity="0.95" stroke="#ffb380" stroke-width="3.5"/>
    <circle cx="705" cy="160" r="7" fill="#ff8a4c" fill-opacity="0.85" stroke="#ffb380" stroke-width="3.5"/>

    <!-- inflection dots -->
    <g fill="#ffffff" fill-opacity="0.85">
      <circle cx="560" cy="460" r="4"/>
      <circle cx="620" cy="430" r="4"/>
      <circle cx="600" cy="380" r="4"/>
      <circle cx="650" cy="360" r="4"/>
      <circle cx="660" cy="300" r="4"/>
    </g>
  </g>

  <!-- ARROW middle → right -->
  <line x1="760" y1="300" x2="820" y2="300" stroke="#9f8fef" stroke-width="6" stroke-opacity="0.85" marker-end="url(#arrowAccent)"/>
  <circle cx="765" cy="300" r="6" fill="#9f8fef" fill-opacity="0.85"/>

  <!-- ============================================================ -->
  <!-- RIGHT SECTION: Rust gear + stopwatch + criterion bench bars   -->
  <!-- ============================================================ -->
  <g>
    <!-- panel frame -->
    <rect x="830" y="80" width="320" height="450" rx="16" fill="#161b22" fill-opacity="0.85" stroke="#4a9eff" stroke-width="4.5" stroke-opacity="0.70"/>
    <rect x="830" y="80" width="320" height="36" rx="16" fill="#1a1d23"/>
    <rect x="830" y="112" width="320" height="4" fill="#4a9eff" fill-opacity="0.65"/>

    <!-- Rust gear (large, upper-half) -->
    <g transform="translate(990 200)">
      <!-- teeth -->
      <g fill="#4a9eff" fill-opacity="0.85" stroke="#a5d6ff" stroke-width="3.5" stroke-opacity="0.95">
        <polygon points="-10,-82 10,-82 16,-62 -16,-62"/>
        <polygon points="32,-76 50,-62 42,-44 22,-54"/>
        <polygon points="62,-44 76,-30 62,-12 48,-22"/>
        <polygon points="76,-10 82,10 60,16 56,-4"/>
        <polygon points="60,32 48,50 30,40 44,22"/>
        <polygon points="32,62 14,76 4,58 22,46"/>
        <polygon points="-10,76 -32,72 -28,52 -14,56"/>
        <polygon points="-42,62 -62,48 -50,30 -34,42"/>
        <polygon points="-70,32 -80,12 -62,2 -54,20"/>
        <polygon points="-80,-12 -74,-34 -56,-26 -62,-8"/>
        <polygon points="-58,-50 -42,-66 -28,-50 -42,-38"/>
        <polygon points="-28,-72 -10,-82 -4,-62 -22,-56"/>
      </g>
      <!-- gear outer ring -->
      <circle cx="0" cy="0" r="64" fill="url(#gearFill)" stroke="#a5d6ff" stroke-width="5.5" stroke-opacity="0.95"/>
      <!-- inner ring -->
      <circle cx="0" cy="0" r="42" fill="#1a1d23" fill-opacity="0.85" stroke="#4a9eff" stroke-width="4.5" stroke-opacity="0.85"/>
      <!-- hub hole -->
      <circle cx="0" cy="0" r="18" fill="#0d1117" stroke="#a5d6ff" stroke-width="4" stroke-opacity="0.95"/>
      <!-- spokes -->
      <g stroke="#4a9eff" stroke-width="4.5" stroke-opacity="0.85">
        <line x1="-42" y1="0" x2="-18" y2="0"/>
        <line x1="18" y1="0" x2="42" y2="0"/>
        <line x1="0" y1="-42" x2="0" y2="-18"/>
        <line x1="0" y1="18" x2="0" y2="42"/>
      </g>
      <!-- hub dot -->
      <circle cx="0" cy="0" r="5" fill="#a5d6ff" fill-opacity="0.95"/>
    </g>

    <!-- Stopwatch (small, to the left of gear, mid-panel) -->
    <g transform="translate(880 200)">
      <rect x="-7" y="-50" width="14" height="12" rx="2.5" fill="#36b37e" fill-opacity="0.85" stroke="#7ee787" stroke-width="3.5"/>
      <line x1="0" y1="-38" x2="0" y2="-32" stroke="#7ee787" stroke-width="4" stroke-opacity="0.95"/>
      <circle cx="0" cy="0" r="32" fill="#1a1d23" stroke="#36b37e" stroke-width="5" stroke-opacity="0.95"/>
      <circle cx="0" cy="0" r="25" fill="#161b22" stroke="#7ee787" stroke-width="3.5" stroke-opacity="0.65"/>
      <g stroke="#7ee787" stroke-width="3.5" stroke-opacity="0.85">
        <line x1="0" y1="-22" x2="0" y2="-17"/>
        <line x1="22" y1="0" x2="17" y2="0"/>
        <line x1="0" y1="22" x2="0" y2="17"/>
        <line x1="-22" y1="0" x2="-17" y2="0"/>
      </g>
      <line x1="0" y1="0" x2="14" y2="-16" stroke="#ff5630" stroke-width="4" stroke-opacity="0.95"/>
      <circle cx="0" cy="0" r="4" fill="#ff5630" fill-opacity="0.95"/>
    </g>

    <!-- Criterion benchmark bars (lower half — 5 stacked rects, Python row vs Rust row) -->
    <!-- legend dots -->
    <circle cx="858" cy="335" r="7" fill="#ff9d1a" fill-opacity="0.95" stroke="#ffb380" stroke-width="3.5"/>
    <circle cx="858" cy="368" r="7" fill="#4a9eff" fill-opacity="0.95" stroke="#a5d6ff" stroke-width="3.5"/>

    <!-- Python row (amber) — longer bars (slower) -->
    <rect x="880" y="328" width="240" height="14" rx="3" fill="#ff9d1a" fill-opacity="0.65" stroke="#ffb380" stroke-width="3.5" stroke-opacity="0.85"/>
    <rect x="1124" y="328" width="6" height="14" rx="2" fill="#ffeb3b" fill-opacity="0.85"/>

    <!-- Rust row (blue) — shorter bars (constant-factor win) -->
    <rect x="880" y="361" width="120" height="14" rx="3" fill="#4a9eff" fill-opacity="0.75" stroke="#a5d6ff" stroke-width="3.5" stroke-opacity="0.85"/>
    <rect x="1004" y="361" width="6" height="14" rx="2" fill="#a5d6ff" fill-opacity="0.95"/>

    <!-- second bench pair -->
    <circle cx="858" cy="402" r="6" fill="#ff9d1a" fill-opacity="0.85" stroke="#ffb380" stroke-width="3.5"/>
    <circle cx="858" cy="435" r="6" fill="#4a9eff" fill-opacity="0.85" stroke="#a5d6ff" stroke-width="3.5"/>
    <rect x="880" y="395" width="200" height="12" rx="3" fill="#ff9d1a" fill-opacity="0.55" stroke="#ffb380" stroke-width="3" stroke-opacity="0.85"/>
    <rect x="880" y="428" width="90" height="12" rx="3" fill="#4a9eff" fill-opacity="0.65" stroke="#a5d6ff" stroke-width="3" stroke-opacity="0.85"/>

    <!-- third bench pair -->
    <circle cx="858" cy="466" r="6" fill="#ff9d1a" fill-opacity="0.85" stroke="#ffb380" stroke-width="3.5"/>
    <circle cx="858" cy="497" r="6" fill="#4a9eff" fill-opacity="0.85" stroke="#a5d6ff" stroke-width="3.5"/>
    <rect x="880" y="459" width="170" height="12" rx="3" fill="#ff9d1a" fill-opacity="0.55" stroke="#ffb380" stroke-width="3" stroke-opacity="0.85"/>
    <rect x="880" y="490" width="64" height="12" rx="3" fill="#4a9eff" fill-opacity="0.65" stroke="#a5d6ff" stroke-width="3" stroke-opacity="0.85"/>

    <!-- bottom status pill -->
    <rect x="850" y="510" width="280" height="14" rx="7" fill="#36b37e" fill-opacity="0.30" stroke="#36b37e" stroke-width="3.5" stroke-opacity="0.65"/>
    <circle cx="868" cy="517" r="4.5" fill="#7ee787" fill-opacity="0.95"/>
    <circle cx="884" cy="517" r="4.5" fill="#7ee787" fill-opacity="0.95"/>
    <circle cx="900" cy="517" r="4.5" fill="#7ee787" fill-opacity="0.95"/>
  </g>

  <!-- bottom hex/dot decorative strip -->
  <g fill="#9f8fef" fill-opacity="0.30">
    <circle cx="120" cy="555" r="5"/>
    <circle cx="150" cy="555" r="5"/>
    <circle cx="180" cy="555" r="5"/>
    <circle cx="210" cy="555" r="5"/>
    <circle cx="990" cy="555" r="5"/>
    <circle cx="1020" cy="555" r="5"/>
    <circle cx="1050" cy="555" r="5"/>
    <circle cx="1080" cy="555" r="5"/>
  </g>
</svg>
