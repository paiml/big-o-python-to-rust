metadata:
  version: 1.0.0
  created: '2026-05-19'
  author: paiml big-o-python-to-rust
  description: |
    O(n) linear-time complexity contract. An operation satisfies this
    contract iff its mean execution time doubles when n doubles,
    within statistical CI bounds [1.8, 2.2], across at least five
    consecutive doublings.
  references:
    - 'Cormen, Leiserson, Rivest, Stein — Introduction to Algorithms, 2.1'
    - 'Rust by Example - Iterator::filter, count, sum (fused, allocation-free)'
    - 'criterion.rs documentation, statistical reporting'

equations:
  linear_time_bound:
    formula: |
      forall n in input_sizes:
        mean(t(2n)) / mean(t(n)) ∈ [1.8, 2.2]
      input_sizes = {1024, 2048, 4096, 8192, 16384, 32768}.
      The ratio must hold for every consecutive doubling.
    domain: 'criterion benchmarks over doubling input sizes'
    invariants:
      - "each doubling of n doubles execution time within [1.8, 2.2]"
      - "allocations scale linearly with n at most"
      - "iterator fusion may produce ratio bounded by [0.8, 1.0] of naive"
    preconditions:
      - "input sizes form a geometric sequence with ratio 2"
      - "at least 5 doublings sampled"
    postconditions:
      - "the fitted complexity class is O(n) with R² >= 0.95"

proof_obligations:
  - type: invariant
    property: doubling ratio in [1.8, 2.2]
    formal: 'forall n in input_sizes, mean(t(2n)) / mean(t(n)) in [1.8, 2.2]'
    applies_to: linear_time_bound
    lean:
      theorem: BigOFromZero.Theorems.LinearTime
      status: not-applicable
  - type: invariant
    property: allocations bounded by O(n)
    formal: 'forall n, allocations(n) <= c * n + k'
    applies_to: linear_time_bound
    lean:
      theorem: BigOFromZero.Theorems.LinearAlloc
      status: not-applicable

falsification_tests:
  - id: FALSIFY-LN-001
    rule: doubling ratio in [1.8, 2.2]
    prediction: 'mean(t(2n)) / mean(t(n)) lies in [1.8, 2.2] for every consecutive doubling'
    test: criterion bench over geometric sizes, compute ratio table, assert bounds
    if_fails: 'operation is sub-linear (ratio < 1.8) or super-linear (ratio > 2.2)'
  - id: FALSIFY-LN-002
    rule: allocations bounded by O(n)
    prediction: 'max heap blocks grows linearly with n, not n^2 or 2^n'
    test: 'dhat-rs instrumented run; fit allocations(n) and assert linear coefficient'
    if_fails: 'operation has quadratic-or-worse hidden allocation'

kani_harnesses:
  - id: KANI-LN-001
    obligation: allocations bounded by O(n)
    bound: 16
    strategy: bounded_int
    solver: cadical

qa_gate:
  id: F-LN-001
  name: complexity-linear-v1 Contract
  description: Quality gate for O(n) linear-time empirical complexity
  checks:
    - validation
    - falsification
    - criterion-bench
